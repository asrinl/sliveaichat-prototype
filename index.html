<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shopee Live Prototype</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body { 
      position: fixed;
      top: 0;
      left: 0;
      width: 100%; 
      height: 100%; 
      height: -webkit-fill-available;
      overflow: hidden; 
      background: #000; 
      touch-action: none;
    }
    
    #camera-feed {
      position: fixed;
      top: 0; 
      left: 0;
      width: 100vw; 
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      z-index: 1;
    }
    
    #figma-overlay {
      position: fixed;
      top: 0; 
      left: 0;
      width: 100vw; 
      height: 100vh;
      height: 100dvh;
      border: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Updated Figma Embed Layer -->
  <iframe id="figma-overlay" src="https://embed.figma.com/proto/LVKuB6KMVbMUCfOjmqgx8y/Untitled?node-id=18-335&p=f&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1&embed-host=share&hide-ui=1&scaling=scale-down-width" allowfullscreen></iframe>

  <script>
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    const video = document.getElementById('camera-feed');
    
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user" }, 
        audio: false 
      })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play().catch(e => console.log("Play error:", e));
        };
      })
      .catch(err => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(stream => {
            video.srcObject = stream;
            video.play();
          });
      });
    }
  </script>

</body>
</html>
